<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Órbita · Beco's Lab</title><link rel="stylesheet" href="orbita.css"></head>
<body>
<header class="floating-tools"><a class="brand" href="index.html" aria-label="Voltar ao site" title="Site"><img src="assets/becoslab.jpg" alt=""></a><div class="tools"><button id="newProject" aria-label="Novo projeto" title="Novo projeto">＋</button><button id="backup" aria-label="Exportar backup" title="Exportar backup">↥</button><button id="publish" aria-label="Exportar versão pública" title="Exportar versão pública (sem a fila)">⇪</button><button id="restore" aria-label="Importar backup" title="Importar backup">↧</button><button id="copyDone" hidden>Copiar concluídos</button><input id="backupFile" type="file" accept="application/json,.json" hidden></div></header>
<main class="universe ladder" id="ladder" aria-label="Escada de maturidade"></main><span id="saveStatus" class="sr-only" role="status"></span>
<section id="gate" class="gate" hidden><form id="gateForm" class="gate-form"><h2>Órbita</h2><input id="gatePassword" type="password" aria-label="Senha" autocomplete="current-password" required><button class="primary" type="submit">Entrar</button><p id="gateError" class="gate-error" role="alert"></p></form></section>
<dialog id="projectDialog" class="project-dialog"><button class="close" id="closeProject" aria-label="Fechar projeto">×</button><button id="parentProject" class="parent-project" hidden></button><span class="detail-image-frame"><img id="detailImage" class="detail-image" alt=""></span><p class="eyebrow" id="detailState"></p><h2 id="detailTitle"></h2><div class="detail-actions"><select id="projectStage" aria-label="Mover projeto para"><option value="pronto">Pronto</option><option value="9">Validação</option><option value="7">Refino</option><option value="5">Núcleo</option><option value="3">Criação</option><option value="1">Ideia</option><option value="pausado">Pausado</option></select><button id="newSubitem">＋ Subitem</button><button id="renameProject">Renomear</button></div><section id="childrenSection"><div class="check-heading"><h3>Entregas</h3><span id="childrenCount"></span></div><div id="children"></div></section><div class="check-heading"><h3>Pequenos passos</h3><span id="taskCount"></span></div><form id="taskForm"><input id="taskInput" placeholder="O que você quer fazer?" aria-label="Nova tarefa" maxlength="500" required autocomplete="off"><button type="button" id="queueTask" class="queue-add" aria-label="Adicionar à fila" title="Adicionar à fila">⏳</button><button aria-label="Adicionar tarefa" type="submit">＋</button></form><div id="tasks"></div><p id="emptyTasks" class="empty-tasks">A lista começa em branco.<br>Adicione só o que fizer sentido agora.</p><div class="check-heading queue-heading"><h3>Na fila</h3><span id="queueCount"></span></div><p class="queue-note">Só você vê. Não entra na versão publicada até você ativar.</p><div id="queue"></div><p id="queueEmpty" class="queue-empty">Nada na fila.</p><p class="detail-note">Clique no texto de uma tarefa para editar.</p></dialog>
<dialog id="nameDialog" class="name-dialog"><form id="nameForm"><h2 id="nameTitle">Novo projeto</h2><input id="nameInput" aria-label="Nome do projeto" maxlength="160" required autocomplete="off"><div><button type="button" id="cancelName">Cancelar</button><button type="submit" class="primary">Salvar</button></div></form></dialog>
<script src="orbita.js" defer></script></body></html>
