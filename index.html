<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Beco's Lab: apps, sistemas criativos, sites, jogos, v&iacute;deos e projetos autorais." />
    <title>Beco's Lab</title>
    <link rel="stylesheet" href="landing-experimento.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" />
  </head>
  <body>
    <div class="lab-noise" aria-hidden="true">
      <svg width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
        <filter id="grain">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" />
          <feColorMatrix type="saturate" values="0" />
        </filter>
        <rect width="100%" height="100%" filter="url(#grain)" />
      </svg>
    </div>

    <main class="experiment-shell">
      <section class="lab-stage snap-screen" aria-label="Beco's Lab">
        <header class="stage-topline">
          <a class="experiment-brand" href="index.html" aria-label="Beco's Lab">
            <span class="brand-orb"><img src="assets/becoslab.jpg" alt="" /></span>
            <span>Beco's Lab</span>
          </a>
          <nav class="experiment-nav" aria-label="Caminhos do Lab">
            <a href="news.html">News</a>
            <a href="metodo.html">M&eacute;todo</a>
          </nav>
        </header>

        <button class="project-back-orb" type="button" data-project-back hidden>
          <span class="back-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          </span>
          <span>Voltar</span>
        </button>

        <div class="door-tabs" role="tablist" aria-label="Portas do Lab">
          <button class="door-tab" type="button" role="tab" aria-selected="false" data-track="apps">
            <span class="door-mark mark-apps" aria-hidden="true"></span>
            <strong>Apps</strong>
            <small>Produtos digitais e experi&ecirc;ncias mobile.</small>
          </button>
          <button class="door-tab" type="button" role="tab" aria-selected="false" data-track="studio">
            <span class="door-mark mark-systems" aria-hidden="true"></span>
            <strong>Studio</strong>
            <small>Design, parcerias e produ&ccedil;&atilde;o do Lab.</small>
          </button>
          <button class="door-tab" type="button" role="tab" aria-selected="false" data-track="info">
            <span class="door-mark mark-methods" aria-hidden="true"></span>
            <strong>Infoprodutos</strong>
            <small>Sa&uacute;de, organiza&ccedil;&atilde;o e curso.</small>
          </button>
        </div>

        <div class="lab-system" aria-label="Mapa visual do Beco's Lab">
          <svg class="constellation" aria-hidden="true" preserveAspectRatio="none">
            <line class="constellation-line" x1="0" y1="0" x2="0" y2="0" />
          </svg>
          <button class="core-orb" type="button" data-reset-lab aria-label="Beco's Lab">
            <span class="orb-image becoslab-zoom"><img src="assets/becoslab.jpg" alt="" /></span>
            <span class="core-title">Beco's Lab</span>
            <span class="core-tagline">Sistema vivo de apps, jogos e m&eacute;todos autorais.</span>
          </button>

          <button class="project-orb orb-glyph" type="button" data-orb-track="apps" data-project="glyph" aria-label="Glyph">
            <span class="orb-image"><img src="assets/glyph.jpg" alt="" /></span>
            <span>Glyph</span>
          </button>
          <button class="project-orb orb-mind" type="button" data-orb-track="apps" data-project="mind" aria-label="Mind Practice">
            <span class="orb-image"><img src="assets/mindpractice.jpg" alt="" /></span>
            <span>Mind</span>
          </button>
          <button class="project-orb orb-elite" type="button" data-orb-track="apps" data-project="elite50" aria-label="Elite50">
            <span class="orb-image"><img src="assets/elite50.jpg" alt="" /></span>
            <span>Elite50</span>
          </button>
          <button class="project-orb orb-kings" type="button" data-orb-track="apps" data-project="kingsworld" aria-label="KingsWorld">
            <span class="orb-image"><img src="assets/kingsworld.jpg" alt="" /></span>
            <span>Kings</span>
          </button>

          <button class="project-orb orb-course" type="button" data-orb-track="info" data-project="course" aria-label="Mapa do Império">
            <span class="orb-image orb-svg-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            </span>
            <span>Mapa do Império</span>
          </button>
          <button class="project-orb orb-tarot" type="button" data-orb-track="studio" data-project="tarot" aria-label="Tarot">
            <span class="orb-image"><img src="assets/tarot.jpg" alt="" /></span>
            <span>Tarot</span>
          </button>
<button class="project-orb orb-sabedoria" type="button" data-orb-track="studio" data-project="sabedoria" aria-label="Studio / YouTube">
            <span class="orb-image"><img src="assets/sabedoriaanimada.jpg" alt="" /></span>
            <span>Studio / YouTube</span>
          </button>
        </div>

        <article class="door-panel" id="trackPanel" aria-live="polite" hidden></article>
      </section>

      <section class="contact-screen snap-screen" id="contactScreen" aria-label="Contato e links do laboratório">
        <footer class="experiment-footer" aria-label="Rodap&eacute;">
          <div class="footer-brand">
            <span class="brand-orb"><img src="assets/becoslab.jpg" alt="" /></span>
            <strong>Beco's Lab</strong>
          </div>
          <div class="footer-links">
            <div class="footer-group">
              <span>Mapa</span>
              <a href="index.html">Home</a>
              <a href="news.html">News</a>
              <a href="metodo.html">M&eacute;todo</a>
            </div>
            <div class="footer-group">
              <span>Legal</span>
              <a href="privacidade.html">Privacidade</a>
              <a href="termos.html">Termos</a>
            </div>
            <div class="footer-group">
              <span>Contato</span>
              <a href="links/">Todos os links</a>
              <a href="https://github.com/arabeco">GitHub</a>
              <a href="https://instagram.com/arabeco1" target="_blank" rel="noopener">Instagram</a>
            </div>
          </div>
        </footer>
      </section>
    </main>

    <section class="experiment-slideshow" id="experimentSlideshow" role="dialog" aria-modal="true" aria-labelledby="slideTitle" hidden>
      <div class="presentation-window">
      <header class="presentation-header">
        <div class="presentation-tools">
          <button class="slide-close" type="button" data-close-slides>← Ver todos</button>
        </div>
      </header>
      <article class="slide-card">
        <div class="slide-media">
          <img id="slideImage" alt="" />
        </div>
        <div class="slide-copy">
          <p id="slideKicker"></p>
          <h2 id="slideTitle"></h2>
          <p id="slideText"></p>
          <div class="slide-state" id="slideState" hidden></div>
          <div class="slide-actions" id="slideActions" hidden></div>
          <button class="presentation-share" type="button" data-copy-project-link>Compartilhar ↗</button>
        </div>
      </article>
      <nav class="presentation-content-nav" aria-label="Páginas da apresentação">
        <button class="slide-nav slide-prev" type="button" data-prev-slide aria-label="Página anterior" title="Página anterior">‹</button>
        <div class="slide-dots" id="slideDots" aria-label="Páginas da apresentação"></div>
        <button class="slide-nav slide-next" type="button" data-next-slide aria-label="Próxima página" title="Próxima página">›</button>
      </nav>
      </div>
    </section>

    <script src="landing-experimento.js"></script>
  </body>
</html>
